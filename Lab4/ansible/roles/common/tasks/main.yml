---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install common necessary packages
  apt:
    name:
      - rsync
      - curl
      - ca-certificates
    state: present

- name: Create student user
  user:
    name: student
    state: present
    shell: /bin/bash
    groups: sudo
    append: yes

- name: Create gradebook file for student
  copy:
    dest: /home/student/gradebook
    content: "26\n"
    owner: student
    group: student
    mode: '0644'

- name: Create teacher user
  user:
    name: teacher
    state: present
    shell: /bin/bash
    password: "{{ '12345678' | password_hash('sha512', 'salt123') }}"
    groups: sudo
    append: yes
    update_password: on_create

- name: Drop-in SSH config to force PasswordAuthentication
  copy:
    dest: /etc/ssh/sshd_config.d/01-enable-passwords.conf
    content: |
      PasswordAuthentication yes
      KbdInteractiveAuthentication yes
    mode: '0644'
  notify: restart ssh

- name: Remove cloud-init SSH override if exists
  file:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
    state: absent
  notify: restart ssh

