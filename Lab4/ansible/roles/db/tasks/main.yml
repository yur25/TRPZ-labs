---
- name: Install MariaDB server and Python MySQL library
  apt:
    name: 
      - mariadb-server
      - python3-pymysql
      - ufw
    state: present

- name: Configure MariaDB to bind to all interfaces
  lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^bind-address\s*='
    line: 'bind-address = 0.0.0.0'
  notify: restart mariadb

- name: Ensure MariaDB service is running and enabled
  systemd:
    name: mariadb
    state: started
    enabled: yes

- name: Create application database
  mysql_db:
    name: "{{ db_name }}"
    state: present
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Create application database user
  mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_pass }}"
    host: "{{ hostvars[groups['workers'][0]]['ansible_host'] }}"
    priv: '{{ db_name }}.*:ALL'
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Configure UFW to allow SSH
  ufw:
    rule: allow
    name: OpenSSH

- name: Configure UFW to allow MariaDB from worker
  ufw:
    rule: allow
    port: '3306'
    proto: tcp
    src: "{{ hostvars[groups['workers'][0]]['ansible_host'] }}"

- name: Enable UFW, deny default incoming
  ufw:
    state: enabled
    policy: deny
    direction: incoming
