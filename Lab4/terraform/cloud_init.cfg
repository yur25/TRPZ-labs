#cloud-config

users:
  - name: ansible
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ${public_key}

package_update: true
package_upgrade: true
packages:
  - qemu-guest-agent
  - python3

runcmd:
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent
